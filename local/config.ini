; Configuración del Blender local. Las líneas que empiezan con ; son comentarios.
[excel]
; Excel del Blender del que se copian precios y aportes la primera vez (o con
; "Importar del Excel"). Si la dejas vacía, la app busca el BLENDER*.xlsx más reciente dentro de tus carpetas de OneDrive.
ruta =

[sap]
; Poner en no para usar solo el Excel (sin conectarse a SAP).
usar = si
dsn = hana
usuario = POWERBI
base = SBO_CNA_CHILE
; Servicio del Administrador de credenciales de Windows donde está guardada la clave
; (el mismo que usa la app del bono, así no hay que guardarla dos veces).
servicio_clave = bono-hana
; Minutos entre lecturas automáticas de SAP.
refrescar_cada_min = 30

[app]
puerto = 8765
